# .github/workflows/release.yml
name: Build Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Bundle with esbuild → dist/cli.cjs ────────────────────────────────────
      - name: Bundle
        run: npm run build

      # ── Package with pkg → dist/backend-x86_64-pc-windows-msvc.exe ───────────
      - name: Package executable
        run: npm run pkg

      # ── SHA256 checksum ───────────────────────────────────────────────────────
      - name: Generate checksum
        run: |
          $hash = (Get-FileHash "dist\cauldroncli-x86_64-pc-windows-msvc.exe" -Algorithm SHA256).Hash
          Set-Content "dist\cauldroncli-x86_64-pc-windows-msvc.exe.sha256" $hash
          Write-Host "SHA256: $hash"

      # ── Upload artifact (available on every run, useful for workflow_dispatch) ─
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldroncli-x86_64-pc-windows-msvc
          path: |
            dist/cauldroncli-x86_64-pc-windows-msvc.exe
            dist/cauldroncli-x86_64-pc-windows-msvc.exe.sha256

      # ── Attach binary to the GitHub Release ───────────────────────────────────
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cauldroncli-x86_64-pc-windows-msvc.exe
            dist/cauldroncli-x86_64-pc-windows-msvc.exe.sha256
