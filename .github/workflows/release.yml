name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build CLI
        run: node build.js

      # Install yao-pkg
      - name: Install yao-pkg
        run: npm install -g @yao-pkg/pkg

      # Package CLI
      - name: Package CLI binary
        run: pkg dist/cli.cjs --targets node20-win-x64 --output dist/cauldroncli.exe

      # Install NSIS
      - name: Install NSIS
        run: choco install nsis -y

      # Build installer
      - name: Build Installer
        run: makensis installer.nsi

      # Upload artifacts
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cauldroncli-installer
          path: |
            dist/cauldroncli.exe
            dist/cauldroncli-setup.exe