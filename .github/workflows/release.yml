name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install deps
      - name: Install dependencies
        run: npm install

      # Build (your esbuild step → outputs dist/cli.cjs)
      - name: Build CLI
        run: node build.js

      # Install pkg (REAL version)
      - name: Install pkg
        run: npm install -g pkg@5.8.1

      # Package CLI (IMPORTANT: use cli.cjs, not ".")
      - name: Package CLI binary
        run: |
          pkg dist/cli.cjs ^
            --targets node18-win-x64 ^
            --output dist/cauldroncli.exe

      # Install NSIS
      - name: Install NSIS
        run: choco install nsis -y

      # Build installer
      - name: Build Installer
        run: makensis installer.nsi

      # Upload artifacts
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cauldroncli-installer
          path: |
            dist/cauldroncli.exe
            dist/cauldroncli-setup.exe