name: Build & Release CauldronCLI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, self-hosted]

    runs-on: ${{ matrix.os }}

    steps:
      # 📥 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 🟢 Node 20 (consistent everywhere)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 📦 Install deps
      - name: Install dependencies
        run: npm ci

      # 🔧 Build (esbuild → dist/cli.cjs)
      - name: Build CLI
        run: node build.js

      # 🔍 Debug output (VERY useful if something breaks)
      - name: Verify dist
        run: |
          echo "Dist contents:"
          ls -R dist || dir dist

      # 📦 Install pkg (CORRECT VERSION)
      - name: Install pkg
        run: npm install -g pkg@6.14.1

      # 📦 Package macOS binary
      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: |
          pkg dist/cli.cjs \
            --targets node20-macos-x64,node20-macos-arm64 \
            --output dist/cauldroncli

      # 📦 Package Windows binary
      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: |
          pkg dist/cli.cjs ^
            --targets node20-win-x64 ^
            --output dist/cauldroncli.exe

      # 🧱 Install NSIS (Windows only)
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      # 🏗 Build Installer (Windows only)
      - name: Build NSIS installer
        if: runner.os == 'Windows'
        run: |
          makensis installer/windows/installer.nsi

      # 📦 Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cauldroncli-${{ runner.os }}
          path: |
            dist/*
            CauldronCLI-Setup.exe

  # 🚀 Create GitHub Release with all artifacts
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}