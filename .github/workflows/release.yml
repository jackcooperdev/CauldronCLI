# .github/workflows/release.yml (in the CauldronCLI repo)
#
# Builds the CLI with pkg (SEA mode) for each platform and uploads the
# binaries to the release that triggered the run. Asset names match the
# Tauri sidecar target triples that the dashboard's fetchBackend.js expects.

name: Build & upload release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build binaries for
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg_target: node22-win-x64
            triple: x86_64-pc-windows-msvc
            ext: .exe
            smoke_test: true
          - os: ubuntu-22.04
            pkg_target: node22-linux-x64
            triple: x86_64-unknown-linux-gnu
            ext: ''
            smoke_test: true
          - os: macos-latest # Apple Silicon runner
            pkg_target: node22-macos-arm64
            triple: aarch64-apple-darwin
            ext: ''
            smoke_test: true
          - os: macos-latest # Intel build made on the arm runner; can't be run here
            pkg_target: node22-macos-x64
            triple: x86_64-apple-darwin
            ext: ''
            smoke_test: false

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle with esbuild
        run: npm run build

      - name: Package with pkg
        run: |
          OUT="dist/cauldroncli-${{ matrix.triple }}${{ matrix.ext }}"
          npx pkg dist/cli.cjs --config package.json \
            --targets ${{ matrix.pkg_target }} \
            --output "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # macOS refuses to run unsigned arm64 binaries, and SEA injection
      # invalidates Node's original signature, so re-sign ad hoc.
      # Swap "-" for your Developer ID identity if you notarise the dashboard.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force "$OUT"

      - name: Smoke test
        if: matrix.smoke_test
        run: |
          chmod +x "$OUT" || true
          "./$OUT" --help

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$OUT" --clobber