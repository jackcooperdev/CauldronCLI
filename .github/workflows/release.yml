name: Build Cauldron Windows Installer

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      # -------------------------
      # Checkout repo
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Node setup
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------
      # Install build tools
      # -------------------------
      - name: Install build tools
        run: |
          npm install -g esbuild
          npm install -g @yao-pkg/pkg

      # -------------------------
      # Build JS entrypoints
      # -------------------------
      - name: Build JS
        run: node build.js

      # -------------------------
      # Package CLI binary
      # -------------------------
      - name: Build CLI
        run: |
          pkg dist/cli.cjs --targets node18-win-x64 --output dist/cauldroncli.exe

      # -------------------------
      # Package WebSocket binary
      # -------------------------
      - name: Build WebSocket
        run: |
          pkg dist/ws.cjs --targets node18-win-x64 --output dist/cauldronws.exe

      # -------------------------
      # HARD VERIFY OUTPUT (IMPORTANT)
      # -------------------------
      - name: Verify dist output
        shell: cmd
        run: |
          echo === DIST CONTENTS ===
          dir dist

          if not exist dist\cauldroncli.exe exit 1
          if not exist dist\cauldronws.exe exit 1

      # -------------------------
      # Download WinSW (service wrapper)
      # -------------------------
      - name: Download WinSW
        shell: powershell
        run: |
          curl.exe -L `
            "https://github.com/winsw/winsw/releases/latest/download/WinSW-x64.exe" `
            -o dist\cauldronws-service.exe

      # -------------------------
      # Create service config
      # -------------------------
      - name: Create WinSW config
        shell: cmd
        run: |
          echo ^<service^> > dist\cauldronws.xml
          echo ^<id^>CauldronWS^</id^> >> dist\cauldronws.xml
          echo ^<name^>Cauldron WebSocket Service^</name^> >> dist\cauldronws.xml
          echo ^<executable^>cauldronws.exe^</executable^> >> dist\cauldronws.xml
          echo ^<startmode^>Automatic^</startmode^> >> dist\cauldronws.xml
          echo ^</service^> >> dist\cauldronws.xml

      # -------------------------
      # Install Scoop + NSIS
      # -------------------------
      - name: Install Scoop + NSIS
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

          iwr -useb get.scoop.sh | iex

          scoop bucket add extras
          scoop install nsis

      # -------------------------
      # CRITICAL: fix PATH for Scoop tools
      # -------------------------
      - name: Add Scoop to PATH
        shell: powershell
        run: |
          echo "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH

      # -------------------------
      # Verify NSIS is available
      # -------------------------
      - name: Verify NSIS
        run: |
          makensis -VERSION

      # -------------------------
      # Build installer
      # -------------------------
      - name: Build installer
        run: |
          makensis installer/setup.nsi

      # -------------------------
      # Upload installer
      # -------------------------
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CauldronInstaller
          path: CauldronInstaller.exe