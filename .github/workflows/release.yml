name: Build & Release CauldronCLI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, self-hosted]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 🔧 Build your CLI bundle
      - name: Build CLI
        run: node build.js

      # 🔍 Debug output (helps avoid silent failures)
      - name: Verify dist
        run: |
          echo "Listing dist directory"
          ls -R dist || dir dist

      # 📦 PACKAGE (macOS)
      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: |
          npx pkg dist/cli.cjs \
            --targets node20-macos-x64,node20-macos-arm64 \
            --output dist/cauldroncli

      # 📦 PACKAGE (Windows)
      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: |
          npx pkg dist/cli.cjs ^
            --targets node20-win-x64 ^
            --output dist/cauldroncli.exe

      # 🧱 INSTALL NSIS (Windows only)
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      # 🏗 BUILD INSTALLER (Windows only)
      - name: Build NSIS installer
        if: runner.os == 'Windows'
        run: |
          makensis installer/windows/installer.nsi

      # 📦 Upload artifacts (both OS)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cauldroncli-${{ runner.os }}
          path: |
            dist/*
            CauldronCLI-Setup.exe

  # 🚀 OPTIONAL: Create GitHub Release with installer
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}