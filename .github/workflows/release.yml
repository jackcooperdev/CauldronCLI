name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      EXE: dist/cauldroncli-x86_64-pc-windows-msvc.exe
      PKG_CACHE_PATH: ${{ github.workspace }}\.pkg-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Base binary is cached, so the GitHub download only happens on a miss
      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.PKG_CACHE_PATH }}
          key: pkg-cache-${{ runner.os }}-node22-v1

      # A stalled download gets killed after 5 min and retried
      - name: Package executable
        uses: nick-fields/retry@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 10
          shell: pwsh
          command: npm run pkg

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:EXE -Algorithm SHA256).Hash
          Set-Content "$env:EXE.sha256" $hash

      - uses: actions/upload-artifact@v4
        with:
          name: cauldroncli-x86_64-pc-windows-msvc
          path: |
            ${{ env.EXE }}
            ${{ env.EXE }}.sha256

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.EXE }}" "${{ env.EXE }}.sha256" --clobber