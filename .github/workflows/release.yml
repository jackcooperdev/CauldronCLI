# .github/workflows/build.yml
name: Build Installer

on:
  push:
    tags:
      - "v*"           # trigger on version tags e.g. v1.0.0
  workflow_dispatch:   # allow manual runs

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node (for building your project) ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Build cli.cjs + ws.cjs ──────────────────────────────────────────────
      - name: Build
        run: node build.js

      # ── Read version from package.json ──────────────────────────────────────
      - name: Get version
        id: pkg
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name    = (Get-Content package.json | ConvertFrom-Json).name
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "NAME=$name"       >> $env:GITHUB_OUTPUT
        shell: pwsh

      # ── Download bundled Node.js (the one shipped inside the installer) ──────
      - name: Download Node.js binary for bundling
        run: |
          $nodeVersion = "20.19.0"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          Invoke-WebRequest $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-tmp
          New-Item -ItemType Directory -Force -Path tools
          Copy-Item "node-tmp\node-v$nodeVersion-win-x64\node.exe" "tools\node.exe"
          Remove-Item node.zip, node-tmp -Recurse -Force
        shell: pwsh

      # ── Download NSSM ────────────────────────────────────────────────────────
      - name: Download NSSM
        run: |
          $url = "https://nssm.cc/ci/nssm-2.24-101-g897c7ad.zip"
          Invoke-WebRequest $url -OutFile nssm.zip
          Expand-Archive nssm.zip -DestinationPath nssm-tmp
          Copy-Item "nssm-tmp\nssm-2.24-101-g897c7ad\win64\nssm.exe" "tools\nssm.exe"
          Remove-Item nssm.zip, nssm-tmp -Recurse -Force
        shell: pwsh

      # ── Patch version + name into the NSI script ─────────────────────────────
      - name: Patch installer.nsi
        run: |
          $name    = "${{ steps.pkg.outputs.NAME }}"
          $version = "${{ steps.pkg.outputs.VERSION }}"
          (Get-Content installer.nsi) `
            -replace 'YOUR_APP_NAME', $name `
            -replace '!define APP_VERSION "1.0.0"', "!define APP_VERSION `"$version`"" `
          | Set-Content installer.nsi
        shell: pwsh

      # ── Compile the NSIS installer ───────────────────────────────────────────
      - name: Compile NSIS installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer.nsi
          additional-plugin-paths: |
            ${{ github.workspace }}\nsis-plugins

      # ── Upload installer as artifact ─────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.NAME }}-${{ steps.pkg.outputs.VERSION }}-setup
          path: dist\*-setup.exe

      # ── Attach to GitHub Release (only on tag pushes) ────────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\*-setup.exe