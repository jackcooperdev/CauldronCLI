name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install deps
      - name: Install dependencies
        run: npm ci

      # 4. Debug structure (TEMP - helps fix your current issue)
      - name: Debug files
        run: |
          echo "PWD:"
          pwd
          echo "Root contents:"
          dir
          echo "Dist contents:"
          dir dist || echo "No dist folder"

      # 5. Run build
      - name: Build project
        run: node build.js

      # 6. Verify build output
      - name: Verify build output
        run: |
          if (!(Test-Path "dist/cli.cjs")) {
            Write-Error "dist/cli.cjs not found"
            exit 1
          }

      # 7. Install Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup -y

      # 8. Build binaries with nexe
      - name: Build CLI binary
        run: npx --yes nexe@5.0.0-beta.4 dist/cli.cjs -t windows-x64-20.10.0 -o cauldroncli.exe --build

      - name: Build WebSocket binary
        run: npx --yes nexe@5.0.0-beta.4 src/utils/websocket.js -t windows-x64-20.10.0 -o cauldronws.exe --build

      # 9. Prepare installer files
      - name: Prepare installer files
        run: |
          mkdir out
          copy cauldroncli.exe out\cauldroncli.exe
          copy cauldronws.exe out\cauldronws.exe

      # 10. Extract version
      - name: Set version
        id: version
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          echo "VERSION=$version" >> $env:GITHUB_ENV

      # 11. Build installer
      - name: Build installer
        run: |
          ISCC.exe cauldron_installer.iss /DAppVersion=${{ env.VERSION }}

      # 12. Create release
      - name: Create release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 13. Upload assets
      - name: Upload assets
        run: |
          gh release upload ${{ github.ref_name }} cauldroncli.exe --clobber
          gh release upload ${{ github.ref_name }} cauldronws.exe --clobber
          gh release upload ${{ github.ref_name }} Output/cauldron-installer.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}