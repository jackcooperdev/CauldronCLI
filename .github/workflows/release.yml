# .github/workflows/build.yml
name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node (for building your project) ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Build cli.cjs + ws.cjs ────────────────────────────────────────────────
      - name: Build
        run: node build.js

      # ── Read version + name from package.json ─────────────────────────────────
      - name: Get package info
        id: pkg
        run: |
          $json = Get-Content package.json | ConvertFrom-Json
          echo "VERSION=$($json.version)" >> $env:GITHUB_OUTPUT
          echo "NAME=$($json.name)" >> $env:GITHUB_OUTPUT

      # ── Download Node.js binary to bundle ─────────────────────────────────────
      - name: Download Node.js binary
        run: |
          $nodeVersion = "20.19.0"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          Invoke-WebRequest $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-tmp
          Copy-Item "node-tmp\node-v$nodeVersion-win-x64\node.exe" "dist\node.exe"
          Remove-Item node.zip, node-tmp -Recurse -Force

      # ── Download NSSM via Chocolatey (already installed on runner) ────────────
      - name: Copy NSSM
        run: Copy-Item "tools\nssm.exe" "dist\nssm.exe"

      # ── Bundle everything into a zip ──────────────────────────────────────────
      - name: Create release zip
        run: |
          $name    = "${{ steps.pkg.outputs.NAME }}"
          $version = "${{ steps.pkg.outputs.VERSION }}"
          $zipName = "$name-$version-release.zip"

          # dist\ now contains: cli.cjs, ws.cjs, node.exe, nssm.exe
          Compress-Archive -Path "dist\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        id: zip

      # ── Generate SHA256 checksum ──────────────────────────────────────────────
      - name: Generate checksum
        run: |
          $zipName = "${{ steps.zip.outputs.ZIP_NAME }}"
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          Set-Content "$zipName.sha256" $hash
          Write-Host "SHA256: $hash"

      # ── Upload as artifact (for non-tag runs / testing) ───────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.NAME }}-${{ steps.pkg.outputs.VERSION }}-release
          path: |
            ${{ steps.zip.outputs.ZIP_NAME }}
            ${{ steps.zip.outputs.ZIP_NAME }}.sha256

      # ── Attach to GitHub Release on tag push ──────────────────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.zip.outputs.ZIP_NAME }}
            ${{ steps.zip.outputs.ZIP_NAME }}.sha256