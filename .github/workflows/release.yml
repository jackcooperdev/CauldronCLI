name: Build & Release Cauldron CLI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install tools
        shell: pwsh
        run: |
          npm install -g nexe@5.0.0-beta.4
          
          choco install innosetup -y

      - name: Build JS bundle (esbuild)
        shell: pwsh
        run: node build.js

      - name: Build CLI binary (nexe)
        shell: pwsh
        run: |
          nexe dist/cli.cjs -t windows-x64-20.10.0 -o cauldroncli.exe --build

      - name: Build WebSocket binary (nexe)
        shell: pwsh
        run: |
          nexe src/utils/websocket.js -t windows-x64-20.10.0 -o cauldronws.exe --build

      - name: Prepare installer folder
        shell: pwsh
        run: |
          mkdir out
          Copy-Item cauldroncli.exe out/cauldroncli.exe
          Copy-Item cauldronws.exe out/cauldronws.exe

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            compile/cauldron_installer.iss `
            /DAppVersion=$version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            cauldroncli.exe
            cauldronws.exe
            Output/cauldron-installer.exe